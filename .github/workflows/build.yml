name: Build Nico Input Buffer

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - Android32
          - Android64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          target: ${{ matrix.target }}
          combine: true

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - uses: actions/upload-artifact@v7
        with:
          name: NicoInputBuffer-Android
          path: ${{ steps.combine.outputs.build-output }}/*.geode
